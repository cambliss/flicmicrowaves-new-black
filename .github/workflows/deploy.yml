name: Deploy to Hostinger VPS

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install & Build Main Frontend
        run: |
          npm ci
          VITE_API_BASE_URL="" npm run build

      - name: Install & Build Admin Panel
        run: |
          cd admin
          npm ci
          VITE_API_BASE_URL="" npm run build

      - name: Deploy Main Frontend Files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 31.97.207.46
          username: root
          key: ${{ secrets.SSH_KEY }}
          source: "dist/*"
          target: "/var/www/flicmicrowaves/frontend"
          strip_components: 1

      - name: Deploy Admin Panel Files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 31.97.207.46
          username: root
          key: ${{ secrets.SSH_KEY }}
          source: "admin/dist/*"
          target: "/var/www/flicmicrowaves/admin"
          strip_components: 2

      - name: Deploy Backend Files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 31.97.207.46
          username: root
          key: ${{ secrets.SSH_KEY }}
          source: "backend/*"
          target: "/var/www/flicmicrowaves/backend"
          strip_components: 1

      - name: Deploy Scripts
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 31.97.207.46
          username: root
          key: ${{ secrets.SSH_KEY }}
          source: "scripts/*"
          target: "/var/www/flicmicrowaves/scripts"
          strip_components: 1

      - name: Execute Server Commands & Restart Services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 31.97.207.46
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            # Ensure directories exist and have readable permissions for Nginx
            mkdir -p /var/www/flicmicrowaves/frontend /var/www/flicmicrowaves/admin /var/www/flicmicrowaves/backend
            chmod -R 755 /var/www/flicmicrowaves
            chown -R www-data:www-data /var/www/flicmicrowaves

            # Install backend production dependencies
            cd /var/www/flicmicrowaves/backend
            npm install --production

            # Update Nginx config if modified
            if [ -f /var/www/flicmicrowaves/scripts/nginx-flic.conf ]; then
              cp /var/www/flicmicrowaves/scripts/nginx-flic.conf /etc/nginx/sites-available/flicmicrowaves.conf
              ln -sf /etc/nginx/sites-available/flicmicrowaves.conf /etc/nginx/sites-enabled/flicmicrowaves.conf
              rm -f /etc/nginx/sites-enabled/default
              nginx -t && systemctl reload nginx
            fi

            # Start or restart PM2 backend process
            if pm2 list | grep -q "flic-backend"; then
              pm2 reload /var/www/flicmicrowaves/backend/ecosystem.config.cjs --env production
            else
              pm2 start /var/www/flicmicrowaves/backend/ecosystem.config.cjs --env production
              pm2 save
            fi

